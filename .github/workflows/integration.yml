name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run integration tests
        run: npm run test:integration
        timeout-minutes: 10
        env:
          # Testcontainers uses the Docker socket — no extra config needed on ubuntu-latest.
          # Increase Node.js memory for the testcontainers global setup phase.
          NODE_OPTIONS: "--max-old-space-size=2048"
